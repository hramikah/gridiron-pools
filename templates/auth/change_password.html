{% extends "base.html" %}
{% block title %}Change Password - Gridiron Pools{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-4 text-center"><span class="pool-icon">🔒</span>Change Password</h2>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Current password</label>
        <input type="password" class="form-control" name="current_password" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">New password</label>
        <input type="password" class="form-control" name="new_password" required minlength="6">
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm new password</label>
        <input type="password" class="form-control" name="confirm_password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary">Change Password</button>
    </form>
  </div>
</div>
{% endblock %}
