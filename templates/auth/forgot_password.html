{% extends "base.html" %}
{% block title %}Forgot Password - Gridiron Pools{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-4 text-center"><span class="pool-icon">🏈</span>Forgot Password</h2>
    <p class="text-muted">
      Enter your username or the email on your account and we'll send you a link
      to set a new password. The link works once and expires in 1 hour.
    </p>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Username or email</label>
        <input type="text" class="form-control" name="identifier" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary">Send reset link</button>
      <a href="{{ url_for('auth.login') }}" class="btn btn-link">Back to login</a>
    </form>
  </div>
</div>
{% endblock %}
